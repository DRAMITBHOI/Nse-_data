name: Run Daily Swing 3.0 Scanner

on:
  schedule:
    - cron: '15 11 * * 1-5' # 4:45 PM IST Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Execute Daily Swing 3.0 Scanner
        run: python swing3_scanner.py

      - name: Commit & Push Scanner Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing3_scanner_results.json || true
          git commit -m "Auto-update Swing 3.0 Daily Scanner [skip ci]" || echo "No changes to commit"
          git push
