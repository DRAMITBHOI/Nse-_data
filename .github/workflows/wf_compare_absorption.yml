name: Compare Scan A vs Institutional Absorption

on:
  workflow_dispatch:

jobs:
  run-comparison-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Ensure Data Directory Exists
        run: mkdir -p data

      - name: Execute Comparative Backtest Engine
        run: python backtest_scana_vs_absorption.py

      - name: Commit & Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scana_vs_absorption_report.json
          git commit -m "Auto-update Scan A vs Absorption Report [skip ci]" || echo "No changes to commit"
          git push
