name: OBV Strategy Backtest & Trade Planner

on:
  schedule:
    - cron: '45 13 * * 1-5'  # Runs daily at 13:45 UTC (7:15 PM IST)
  workflow_dispatch:        # Allows 1-click manual run anytime

permissions:
  contents: write

jobs:
  backtest-and-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Run Historical Backtest & Dynamic Planner
        run: python backtest_and_plan.py

      - name: Commit & Push Plan to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backtest_report.json data/active_trade_plan.json
          git diff --staged --quiet || (git commit -m "Update OBV backtest matrix & high-probability trade plan" && git push)
