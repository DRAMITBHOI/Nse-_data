name: True OBV Parameter Optimizer

on:
  schedule:
    - cron: '0 14 * * 1-5'   # Runs Mon-Fri at 7:30 PM IST (14:00 UTC)
  workflow_dispatch:         # Manual 1-click execution

permissions:
  contents: write

jobs:
  run-optimizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Run Parameter Optimization Engine
        run: python optimize_obv_parameters.py

      - name: Commit & Push Optimal Matrices
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/optimal_grid_matrix.json data/optimal_trade_plan.json
          git diff --staged --quiet || (git commit -m "Update OBV optimization matrices & optimal plan" && git push)
