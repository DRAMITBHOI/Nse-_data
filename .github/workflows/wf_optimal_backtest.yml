name: Run Nifty 100 Optimal Backtest

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Execute Optimal Backtest
        run: |
          python backtest_nifty100_optimal.py

      - name: Commit & Push Backtest Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/nifty100_optimal_summary.json data/nifty100_optimal_trades.csv || true
          
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-audit: Update optimal Nifty 100 backtest results [skip ci]"
            for i in {1..5}; do
              git fetch origin main
              git rebase origin/main && git push origin main && break || sleep 3
            done
          else
            echo "No changes detected to commit."
          fi
