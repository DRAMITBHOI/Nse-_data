name: Sync F&O Historical Derivatives

on:
  schedule:
    - cron: '30 12 * * 1-5' # 6:00 PM IST (Mon-Fri)
  workflow_dispatch:

jobs:
  sync-fno-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Ensure Data Directory Exists
        run: mkdir -p data

      - name: Execute F&O Historical Ingestion
        run: python build_fno_history.py

      - name: Commit and Push Updated F&O History
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fno_history.json
          git commit -m "Auto-sync daily F&O derivative contracts & OI [skip ci]" || echo "No changes to commit"
          git push
