name: Prune Inactive Symbols & Sync SUPREMEPWR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas requests yfinance

      - name: Run Prune and Fetch Script
        run: python prune_and_sync.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Prune dead tickers to active universe & add SUPREMEPWR [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
