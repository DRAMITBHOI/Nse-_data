name: Run Daily Swing Ultra Non-750 Scanner

on:
  workflow_run:
    workflows: ["Daily NSE Stock Update"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: scanner-su-non750
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 25

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Execute Daily Swing Ultra Non-750 Scanner
        run: |
          # Handles case sensitivity on Linux runner
          if [ -f "swing_ultraN750.py" ]; then
            python swing_ultraN750.py
          elif [ -f "Swing_ultraN750.py" ]; then
            python Swing_ultraN750.py
          else
            echo "Error: swing_ultraN750.py script not found!"
            exit 1
          fi

      - name: Commit & Push Scanner Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage both root and data/ results plus consolidated active_watchlist.json
          git add swing_ultraN750_results.json || true
          git add data/swing_ultraN750_results.json || true
          git add data/active_watchlist.json || true
          
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update Swing Ultra Non-750 & Active Watchlist [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No changes detected to commit."
          fi
