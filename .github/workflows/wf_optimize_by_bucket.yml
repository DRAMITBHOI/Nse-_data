name: Execute Multi-Bucket Combinatorial Optimization

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bucket-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Ensure Data Directory Exists
        run: mkdir -p data

      - name: Run Bucket Combinatorial Optimization
        run: python optimize_by_bucket.py

      - name: Commit & Push Leaderboard Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bucket_optimization_leaderboard.json
          if git diff --staged --quiet; then
            echo "No changes in bucket leaderboard."
          else
            git commit -m "Update Multi-Bucket Combinatorial Leaderboard [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
