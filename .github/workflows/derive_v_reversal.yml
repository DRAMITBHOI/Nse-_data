name: "Derive V-Reversal Optimal Parameters"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-v-reversal-derivation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Step 1 - Extract V-Reversal Dataset & Forward Trajectories
        run: |
          python scripts/derive_v_reversal_dataset.py

      - name: Step 2 - Analyze Parameter Distributions & Exit Performance
        run: |
          python scripts/analyze_v_reversal_distributions.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/v_reversal_dataset.csv data/v_reversal_parameters_report.json data/v_reversal_parameters_report.md
          git commit -m "Automated derivation: optimal V-Reversal parameters and exit benchmarks" || echo "No changes to commit"
          git push
