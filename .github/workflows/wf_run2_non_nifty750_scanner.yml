name: Run Non-Nifty 750 Swing 3 Run 2 Scanner

on:
  workflow_run:
    workflows: ["Daily NSE Stock Update"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: scanner-run2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Execute Non-Nifty 750 Scanner
        run: python swing3_run2_non_nifty750_scanner.py

      - name: Commit & Push Scanner Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing3_run2_non_nifty750_scanner_results.json || true
          git commit -m "Auto-update Non-Nifty 750 Scanner Results [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
