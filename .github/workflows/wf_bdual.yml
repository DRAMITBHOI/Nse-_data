name: Dual Institutional Strategy Backtest

on:
  workflow_dispatch:

jobs:
  run-dual-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Execute Dual Backtest Engine
        run: python backtest_dual_institutional.py

      - name: Commit & Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/integrated_institutional_report.json
          git commit -m "Auto-update Dual Strategy Backtest Report [skip ci]" || echo "No changes to commit"
          git push
