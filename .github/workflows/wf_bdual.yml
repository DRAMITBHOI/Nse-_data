name: Dual Institutional Strategy Backtest

on:
  workflow_dispatch:

jobs:
  run-dual-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Execute Dual Backtest Engine
        run: |
          if [ -f "backtest_dual_institutional.py" ]; then
            python backtest_dual_institutional.py
          elif [ -f "backtest_integrated_institutional.py" ]; then
            python backtest_integrated_institutional.py
          else
            echo "❌ File not found! Available Python files:"
            ls -la *.py
            exit 1
          fi

      - name: Commit & Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "Auto-update Dual Strategy Backtest Report [skip ci]" || echo "No changes to commit"
          git push
