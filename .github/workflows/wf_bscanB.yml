name: Scan B Strategy Automated Backtest

on:
  schedule:
    - cron: '0 12 * * 1-5' # Runs at 5:30 PM IST (Mon-Fri)
  workflow_dispatch:

jobs:
  run-backtest-scanB:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas numpy requests

      - name: Execute Scan B Backtest Engine
        run: |
          python backtest_scanB.py

      - name: Commit & Push Scan B Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scanB_backtest_report.json
          git commit -m "Auto-update Scan B 60-day target backtest report [skip ci]" || echo "No changes to commit"
          git push
