name: Temporary Swing Strategy Backtest

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-swing-strategy-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository and historical data
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run existing three-exit backtest engine
        run: python backtest_3_models_nogap.py

      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: swing-strategy-backtest-results
          path: comparison_3_models_nogap_results.json
          if-no-files-found: error
          retention-days: 14
