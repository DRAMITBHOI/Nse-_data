name: OBV Divergence Strategy Backtest

on:
  workflow_dispatch:

jobs:
  run-obv-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Ensure Directories Exist
        run: mkdir -p data

      - name: Execute OBV Divergence Backtest Engine
        run: python backtest_obv_divergence.py

      - name: Commit & Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/obv_backtest_report.json
          git commit -m "Auto-update OBV Divergence Backtest Report [skip ci]" || echo "No changes to commit"
          git push
