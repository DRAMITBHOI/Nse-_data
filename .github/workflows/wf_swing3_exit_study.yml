name: Execute Swing 3 Exit Architecture Study

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-exit-study:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Execute Exit Study Engine
        run: python swing3_exit_study.py

      - name: Commit & Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing3_exit_study_results.json || true
          git commit -m "Update Swing 3 Exit Study Results [skip ci]" || echo "No changes to commit"
          git push
