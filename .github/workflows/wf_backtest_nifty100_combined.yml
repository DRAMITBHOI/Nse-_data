name: Nifty 100 Combined Backtest

on:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Execute Backtest
        run: |
          python backtest_nifty100_combined.py

      - name: Commit & Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Backtest Bot"
          git pull --rebase origin main || true
          git add data/nifty100_combined_summary.json data/nifty100_combined_trades.csv || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-audit: Update Nifty 100 combined backtest results [skip ci]" && git push)
