name: Run Gap-Up Empirical Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas numpy

      - name: Execute Gap-Up Empirical Derivation
        run: python gap_up_empirical_audit.py

      - name: Commit & Push Audit Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gap_up_empirical_audit_results.json gap_up_empirical_audit.py
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Complete Gap-Up Empirical Audit Results [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No changes detected to commit."
          fi
