name: Run Daily Swing Ultra 750

on:
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * 1-5'  # 4:05 PM IST Monday-Friday

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Execute Daily Swing Ultra 750 Scanner
        run: |
          python swing_ultra750.py

      - name: Commit & Push Scanner Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all updated results, logs, and data files
          git add -A
          
          # Check if there are changes to commit
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-update Swing Ultra 750 Daily Scanner [skip ci]"
            
            # Rebase cleanly against any remote edits before pushing
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No changes detected to commit."
          fi
