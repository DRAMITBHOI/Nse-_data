name: NSE Daily 6:30 PM Update & Wyckoff Scan

on:
  schedule:
    # 6:30 PM IST (Mon-Fri) = 1:00 PM UTC
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-nse-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: 1. Update Bhavcopy & Delivery Volume Data
        run: |
          python update_all_stocks.py

      - name: 2. Run Wyckoff True OBV Screener
        run: |
          if [ -f "scanobv.py" ]; then
            python scanobv.py
          elif [ -f "wyckoff_scan.py" ]; then
            python wyckoff_scan.py
          elif [ -f "obv_scan.py" ]; then
            python obv_scan.py
          else
            echo "⚠️ No dedicated scanner script found, continuing..."
          fi

      - name: 3. Commit & Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected to commit."
          else
            git commit -m "Auto-update NSE delivery data & Wyckoff scan [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
