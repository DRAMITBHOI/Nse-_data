name: NSE Daily Update & Swing 2.0 Scan

on:
  schedule:
    # 7:45 PM IST (Mon-Fri) = 14:15 UTC (safely after NSE delivery reports settle)
    - cron: '15 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: 1. Update Bhavcopy & Delivery Volume Data
        run: python update_all_stocks.py

      - name: 2. Execute Swing 2.0 Production Scanner
        run: python swing2_scanner.py

      - name: 3. Commit & Push Updated Data & Scan Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data or scanner changes detected to commit."
          else
            git commit -m "Auto: Update NSE delivery data & Swing 2.0 scan [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git pull --rebase origin main
            git push origin main
          fi
