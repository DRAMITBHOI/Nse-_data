name: Run Historical Live Trigger Audit

on:
  workflow_dispatch:

jobs:
  run-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas yfinance numpy

      - name: Run Audit Script
        run: |
          python audit_historical_live_triggers.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          if [ -f data/live_scanner_full_audit.json ]; then
            git add -f data/live_scanner_full_audit.json
            git commit -m "Update live breakout audit dataset [skip ci]" || echo "No changes"
            git push origin main
          fi
