name: Multibagger Momentum Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 6'

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests tabulate

      - name: Execute MB3 Matrix Engine
        run: |
          python mb3_backtest.py

      - name: Commit and Push MB3 Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f mb3_summary.csv mb3_trades.csv
          git commit -m "Auto-update MB3 backtest results [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Git push skipped"

      - name: Upload Backup Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mb3-backtest-results
          path: |
            mb3_summary.csv
            mb3_trades.csv
