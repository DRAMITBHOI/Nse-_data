name: Multibagger Momentum Backtest

on:
  workflow_dispatch:
  schedule:
    # Runs every Saturday at 18:30 UTC (00:00 IST Sunday)
    - cron: '30 18 * * 6'

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests tabulate

      - name: Execute Multibagger Backtest Engine
        run: |
          python multibagger_backtest.py

      - name: Publish
