name: Multibagger Momentum Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 6'

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance requests tabulate

      - name: Execute MB1 Engine
        run: |
          python mb1_backtest.py

      - name: Auto-Commit MB1 Results to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add mb1_summary.csv mb1_tiers.csv mb1_trades.csv
          git diff --staged --quiet || (git commit -m "Auto-update MB1 backtest results [skip ci]" && git push)
