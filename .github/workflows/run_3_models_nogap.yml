name: Backtest 3 Models No-Gap Comparison

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-3-models-nogap
  cancel-in-progress: true

jobs:
  run-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run 3 Models No-Gap Backtest Engine
        run: |
          python backtest_3_models_nogap.py

      - name: Commit and Push Results JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add comparison_3_models_nogap_results.json
          git commit -m "chore: save 3 models no-gap backtest results" || echo "No changes to commit"
          git push origin main
