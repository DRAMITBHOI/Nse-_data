name: Scan OBV (7.5, 8, 8)

on:
  schedule:
    - cron: '30 13 * * 1-5'  # Runs Mon-Fri at 7:00 PM IST (13:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Execute Scan OBV Script
        run: python "scanobv(7.5,8,8).py"

      - name: Commit & Push Screener Output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wyckoff_screener_results.json
          git diff --staged --quiet || (git commit -m "Update scanobv(7.5,8,8) results" && git push)
