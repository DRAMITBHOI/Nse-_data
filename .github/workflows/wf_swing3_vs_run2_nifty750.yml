name: Execute Swing 3 vs Run 2 Nifty 750 Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Nifty 750 Comparison Engine
        run: python swing3_vs_run2_nifty750.py

      - name: Commit & Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing3_vs_run2_nifty750_results.json || true
          git commit -m "Update Nifty 750 Head-to-Head Comparison [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
