name: Scan Gap Margin Retests

on:
  schedule:
    - cron: '15 10 * * 1-5' # 3:45 PM IST (Mon-Fri)
  workflow_dispatch:

jobs:
  run-gap-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Ensure Directory Exists
        run: mkdir -p data

      - name: Execute Gap Margin Screener
        run: python scan_gap_margins.py

      - name: Commit & Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gap_margin_candidates.json
          git commit -m "Auto-update F&O Gap Margin Candidates (>=2% gaps) [skip ci]" || echo "No changes to commit"
          git push
