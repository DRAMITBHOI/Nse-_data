name: Run Genetic Strategy Optimizer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Ensure Data Directory Exists
        run: mkdir -p data

      - name: Execute Grid Optimizer Engine
        run: python optimize_institutional_engine.py

      - name: Commit & Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/optimal_strategies.json
          if git diff --staged --quiet; then
            echo "No optimizer changes detected."
          else
            git commit -m "Update Grid Optimization Results [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
