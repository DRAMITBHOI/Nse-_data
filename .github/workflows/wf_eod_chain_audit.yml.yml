name: Automatic EOD Accuracy Audit Chain

on:
  workflow_run:
    workflows:
      - "Run Daily Swing Ultra 750 Scanner"
      - "Run Daily Swing Ultra Non-750 Scanner"
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: eod-accuracy-audit-group
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit-and-compile:
    # Only run if the triggering workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir requests pandas

      - name: Run Accuracy Comparison & Telegram Audit
        run: |
          SCRIPT_PATH=$(find . -maxdepth 3 -iname "audit_scanner_accuracy.py" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "❌ audit_scanner_accuracy.py not found!"
            exit 1
          fi
          echo "🚀 Running accuracy audit script: $SCRIPT_PATH"
          python "$SCRIPT_PATH"

      - name: Commit & Push Cumulative Accuracy Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f data/accuracy_audit_log.json ]; then
            git add -f data/accuracy_audit_log.json
            git commit -m "Auto-compile Daily Scanner Accuracy Audit [skip ci]" || echo "No changes to commit"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "⚠️ No accuracy_audit_log.json file found."
          fi
