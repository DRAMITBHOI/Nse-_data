name: Multi-Universe Historical Backtest (Exit 2.2)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pandas numpy requests

      - name: Execute Segmented Backtest
        run: |
          python backtest_exit2_2_segmented.py

      - name: Commit & Push Backtest Trade Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f data/segmented_backtest_trades_exit2_2.csv ]; then
            git add -f data/segmented_backtest_trades_exit2_2.csv
            git commit -m "Update Segmented Exit 2.2 Backtest Results [skip ci]" || echo "No changes to commit"
            git pull --rebase --autostash origin main
            git push origin main
          fi
