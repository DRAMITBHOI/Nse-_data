name: Derive Launchpad Dataset

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dataset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Launchpad Extraction
        run: |
          python scripts/derive_launchpad_dataset.py

      - name: Commit and Push launchpad_dataset.csv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/launchpad_dataset.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update launchpad_dataset.csv [skip ci]" && git push)
