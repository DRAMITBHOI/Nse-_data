name: Ultimate FNO Live Intraday Scanner

on:
  schedule:
    # 03:45 UTC to 10:00 UTC = 09:15 IST to 15:30 IST (Mon-Fri) every 15 mins
    - cron: '*/15 4-10 * * 1-5'
  workflow_dispatch:

jobs:
  run-live-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Live Ultimate FNO Scanner
        env:
          TELEGRAM_BOT_TOKEN_ULTIMATE: ${{ secrets.TELEGRAM_BOT_TOKEN_ULTIMATE || '9160227761:AAE2zmSpvqttJl3_KKl3jjyKkMg-CopgtSY' }}
          TELEGRAM_CHAT_ID_ULTIMATE: ${{ secrets.TELEGRAM_CHAT_ID_ULTIMATE || '7860290981' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python live_scan_ultimateFNO.py

      - name: Commit & Push Intraday State
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Live FNO Scanner Bot"
          git pull --rebase origin main || true
          git add Codes/data/live_fno_ultimate_breakouts.json data/live_fno_ultimate_breakouts.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Live FNO breakout state [skip ci]" && git push)
