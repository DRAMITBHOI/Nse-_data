name: Execute Scan HP3 5-Year Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-hp3-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Ensure Data Directory Exists
        run: mkdir -p data

      - name: Execute HP3 Historical Backtest Engine
        run: python backtest_hp3.py

      - name: Commit & Push Backtest Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest_hp3_report.json
          if git diff --staged --quiet; then
            echo "No backtest report changes detected."
          else
            git commit -m "Update HP3 Backtest Report (2021-Present) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
