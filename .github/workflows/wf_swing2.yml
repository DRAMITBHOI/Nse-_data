name: Swing 2.0 Backtest & Scan Pipeline

on:
  schedule:
    # 7:30 PM IST (Mon-Fri) = 14:00 UTC (runs after Bhavcopy updates)
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-swing2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pandas numpy requests

      - name: Execute Swing 2.0 Backtest Engine
        run: python swing2_backtest.py

      - name: Commit and Push Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/swing2_backtest_report.json
          if git diff --staged --quiet; then
            echo "No changes in backtest report."
          else
            git commit -m "Auto-update Swing 2.0 comparative backtest report [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
