name: Execute Engine Comparison Backtest

on:
  workflow_dispatch:

concurrency:
  group: engine-comp-backtest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Engine Decomposition Engine
        run: python swing3_engine_comparison_backtest.py

      - name: Commit & Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing3_engine_comparison_results.json || true
          git commit -m "Update V-Reversal vs Launchpad Backtest Results [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
