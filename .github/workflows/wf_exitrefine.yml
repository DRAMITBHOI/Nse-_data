name: Refine Exit Backtest (Distribution Machine)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * 1-5'

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas

      - name: Run Institutional Distribution Backtest
        run: |
          python refine_exit.py

      - name: Commit and Push Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/refine_exit_results.json data/refine_exit_trades.csv
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto: Update refined distribution exit backtest [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
