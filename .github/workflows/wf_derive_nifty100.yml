name: Re-run Nifty 100 Empirical Derivation

on:
  workflow_dispatch:

jobs:
  run-derivation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Execute Derivation Script
        run: |
          python derive_nifty100.py

      - name: Commit & Push Derivation Artifacts
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Derivation Bot"
          git pull --rebase origin main || true
          git add data/nifty100_derivation_summary.json data/nifty100_derivation_dump.csv || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-audit: Update Nifty 100 derivation matrix [skip ci]" && git push)
