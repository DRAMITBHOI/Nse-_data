name: 1W-52W True Delivery Screener

on:
  schedule:
    - cron: '30 13 * * 1-5'  # Runs Mon–Fri at 13:30 UTC (7:00 PM IST)
  workflow_dispatch:        # Allows manual trigger anytime from Actions tab

permissions:
  contents: write

jobs:
  screen-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Run Screener Engine
        run: python run_screener.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_results.json
          git diff --staged --quiet || (git commit -m "Update daily 1W-52W True Delivery Screener results" && git push)
