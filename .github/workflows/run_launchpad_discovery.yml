name: Run Launchpad Discovery

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy

      - name: Run Launchpad discovery script
        run: python discover_launchpad.py

      - name: Commit discovery and audit CSVs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/launchpad_discovery_corrected.csv data/launchpad_original_baseline_corrected.csv data/audit_exclusions.csv data/audit_corporate_actions.csv data/audit_duplicate_dates.csv
          git commit -m "Add Launchpad discovery and audit datasets" || exit 0
          git push
