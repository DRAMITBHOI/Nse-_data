name: Run Nifty 100 Multivariate Derivation

on:
  workflow_dispatch:

jobs:
  run-derivation:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Execute Derivation Script
        run: |
          python derivation.py

      - name: Commit & Push Summary Artifact
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add data/nifty100_multivariate_summary.json || true
          
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "Auto-audit: Update Nifty 100 multivariate derivation summary [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          else
            echo "No changes detected to commit."
          fi
