name: Scan HP1 Daily Production Screener

on:
  schedule:
    # 7:00 PM IST (Mon-Fri) = 1:30 PM UTC (after NSE 6:30 PM delivery data release)
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-hp1-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Ensure Data Directory Exists
        run: mkdir -p data

      - name: Execute HP1 Scanner Engine
        run: python scan_hp1.py

      - name: Commit & Push HP1 Watchlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scan_hp1_results.json
          if git diff --staged --quiet; then
            echo "No screener changes detected."
          else
            git commit -m "Auto-update Scan HP1 Watchlist [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
