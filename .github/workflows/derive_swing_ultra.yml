name: "Derive Swing Ultra Optimal Parameters"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-derivation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Step 1 - Extract Breakout Dataset & Forward Paths
        run: |
          python scripts/derive_swing_ultra_dataset.py

      - name: Step 2 - Compute Parameter Distributions & Optimal Thresholds
        run: |
          python scripts/analyze_breakout_distributions.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/breakout_dataset.csv data/optimal_parameters_report.json data/optimal_parameters_report.md
          git commit -m "Automated derivation: optimal Swing Ultra parameters and exit comparison" || echo "No changes to commit"
          git push
