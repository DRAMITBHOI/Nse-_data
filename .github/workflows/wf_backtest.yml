name: Run Universe Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Ensure Directories Exist
        run: mkdir -p data

      - name: Execute Backtest Engine
        run: python backtest_universe.py

      - name: Commit Backtest Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest_universe_report.json
          if git diff --staged --quiet; then
            echo "No changes to report."
          else
            git commit -m "Update Core Universe Backtest Report [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
