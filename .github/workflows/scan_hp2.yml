name: Execute SCAN_HP2 Screener

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *' # 13:30 UTC = 7:00 PM IST (Daily)

permissions:
  contents: write

jobs:
  run-scan-hp2:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Ensure Data Directory Exists
        run: mkdir -p data

      - name: Run HP2 Engine
        run: python scan_hp2.py

      - name: Commit & Push HP2 Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scan_hp2_results.json
          if git diff --staged --quiet; then
            echo "No changes in HP2 signals."
          else
            git commit -m "Update SCAN_HP2 Results [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
