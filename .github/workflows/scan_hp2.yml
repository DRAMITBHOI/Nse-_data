name: Scan HP2 Daily Production Screener

on:
  schedule:
    # 7:15 PM IST (Mon-Fri) = 1:45 PM UTC (runs cleanly after daily delivery reconciliation)
    - cron: '45 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-hp2-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Ensure Data Directory Exists
        run: mkdir -p data

      - name: Execute HP2 Scanner Engine
        run: python scan_hp2.py

      - name: Commit & Push HP2 Watchlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scan_hp2_results.json
          if git diff --staged --quiet; then
            echo "No screener changes detected."
          else
            git commit -m "Auto-update Scan HP2 Watchlist [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
