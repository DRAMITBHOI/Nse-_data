name: SMC Swing Strategy Backtest

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * 1-5' # Runs automatically at 20:00 IST on weekdays

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance pyarrow fastparquet

      - name: Run SMC Backtest
        run: python smc_backtest.py

      - name: Commit & Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add -A backtest_results/
          if git diff --staged --quiet; then
            echo "No changes in backtest output."
          else
            git commit -m "Auto-update: SMC backtest trade results [skip ci]"
            git push origin HEAD:main
          fi
