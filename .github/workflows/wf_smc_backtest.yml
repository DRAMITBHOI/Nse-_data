name: SMC Swing Strategy Backtest

on:
  workflow_dispatch:
  # Run directly after your evening sync completes (e.g. 19:00 UTC / ~00:30 IST)
  schedule:
    - cron: '0 19 * * 1-5'

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow fastparquet

      - name: Run SMC Backtest on Local Archive
        run: python smc_backtest.py

      - name: Commit & Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_results/
          if git status --porcelain | grep -q "backtest_results"; then
            git commit -m "Auto-update: SMC backtest trade results [skip ci]"
            git push
          else
            echo "No changes in backtest output files."
          fi
