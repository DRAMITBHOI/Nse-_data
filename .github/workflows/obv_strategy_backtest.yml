name: OBV Segmented Strategy Backtest

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  schedule:
    - cron: '0 14 * * 6' # Runs automatically every Saturday at 19:30 IST

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests

      - name: Run Liquidity-Segmented OBV Backtest
        run: |
          python backtest_and_plan.py

      - name: Commit and Push Backtest Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/segmented_backtest_report.json data/nifty750.json || true
          git commit -m "Auto-update liquidity-segmented OBV backtest report" || exit 0
          git push
