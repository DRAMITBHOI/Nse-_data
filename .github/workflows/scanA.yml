name: Daily Market Data & ScanA Execution

on:
  schedule:
    - cron: '30 11 * * 1-5' # Runs at 5:00 PM IST (Mon-Fri)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install pandas numpy

      - name: Fetch Daily Bhavcopy & Update Histories
        run: |
          python daily_updater.py

      - name: Run scanA Screener
        run: |
          python scanA.py

      - name: Run Segmented Liquidity Backtest
        run: |
          python backtest_segmented_liquidity.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "Auto-update market data, scanA results, and backtest report [skip ci]" || echo "No changes to commit"
          git push
