name: Backtest 3 Exit Models Comparison

on:
  workflow_dispatch:

concurrency:
  group: backtest-3-exit-models
  cancel-in-progress: true

jobs:
  run-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run 3 Exit Models Backtest Engine
        run: |
          python backtest_3_exit_models.py
