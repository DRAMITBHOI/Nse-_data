name: Daily NSE Stock Update

on:
  schedule:
    # 7:00 PM IST (13:30 UTC), Monday through Friday
    # Allows full buffer for Bhavcopy and MTO Deliverable Reports upload
    - cron: '30 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stock-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Fetch and Append NSE Daily Data
        run: python update_all_stocks.py

      - name: Commit and Push Updated Market Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "Auto-update NSE daily records [skip ci]" || echo "No new candles to commit"
          git push
