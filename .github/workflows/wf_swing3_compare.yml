name: Compare Swing 3.0 Iterations

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Execute Comparison Backtest
        run: python swing3_compare.py

      - name: Commit & Push Comparison Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing3_compare.json || true
          git commit -m "Update Swing 3.0 Iteration Comparison [skip ci]" || echo "No changes to commit"
          git push
