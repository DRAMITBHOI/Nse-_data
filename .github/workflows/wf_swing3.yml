name: Execute Swing 3.0 Strategy Backtest

on:
  schedule:
    - cron: '0 11 * * 5' # 4:30 PM IST every Friday (11:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-swing3-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Execute Swing 3.0 Engine
        run: python swing3.py

      - name: Commit & Push Backtest Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing3_results.json data/swing3_summary.html || true
          git commit -m "Auto-update Swing 3.0 Backtest Results [skip ci]" || echo "No changes to commit"
          git push
