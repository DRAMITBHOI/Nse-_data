name: Live Breakout Scanner V2 (Optimized Silent)

on:
  workflow_dispatch:

concurrency:
  group: intraday-scanner-v2-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-live-scan-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir pandas requests

      - name: Execute Live Scanner V2
        run: |
          python intraday_live_scanner_v2.py

      - name: Commit & Push Scanner V2 Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -f data/live_intraday_breakouts_v2.json ]; then
            git add -f data/live_intraday_breakouts_v2.json
            git commit -m "Auto-update Scanner V2 Breakouts [skip ci]" || echo "No changes to commit"
            git pull --rebase --autostash origin main
            git push origin main
          fi
