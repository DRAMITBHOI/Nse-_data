name: 15-Min Intraday Live Breakout Scanner

on:
  schedule:
    # 09:15 AM to 03:30 PM IST corresponds to 03:45 to 10:00 UTC (Monday to Friday)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: intraday-scanner-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-live-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance

      - name: Run Cumulative Intraday Live Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python intraday_live_scanner.py

      - name: Commit & Push Cumulative Live Breakouts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -f data/live_intraday_breakouts.json || true
          git commit -m "Auto-update Cumulative Breakouts [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin main
