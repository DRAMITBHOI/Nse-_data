name: 30-Min Intraday Live Breakout Scanner

on:
  schedule:
    # 03:45 UTC (9:15 AM IST)
    - cron: '45 3 * * 1-5'
    # 04:15, 04:45 UTC (9:45 AM, 10:15 AM IST)
    - cron: '15,45 4 * * 1-5'
    # 05:15, 05:45 UTC (10:45 AM, 11:15 AM IST)
    - cron: '15,45 5 * * 1-5'
    # 06:15, 06:45 UTC (11:45 AM, 12:15 PM IST)
    - cron: '15,45 6 * * 1-5'
    # 07:15, 07:45 UTC (12:45 PM, 1:15 PM IST)
    - cron: '15,45 7 * * 1-5'
    # 08:15, 08:45 UTC (1:45 PM, 2:15 PM IST)
    - cron: '15,45 8 * * 1-5'
    # 09:15, 09:45 UTC (2:45 PM, 3:15 PM IST)
    - cron: '15,45 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: live-intraday-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Intraday Live Scanner
        run: python intraday_live_scanner.py

      - name: Commit & Push Live Breakouts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/live_intraday_breakouts.json
          git commit -m "Auto-update Intraday Breakouts [skip ci]" || echo "No changes to commit"
          git push origin main
