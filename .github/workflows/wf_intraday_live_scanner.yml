name: 15-Min Intraday Live Breakout Scanner

on:
  schedule:
    # 09:15 AM to 03:30 PM IST corresponds to 03:45 to 10:00 UTC (Monday to Friday)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: intraday-scanner-group
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Locate and Execute Cumulative Intraday Live Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SCRIPT_PATH=$(find . -maxdepth 3 -iname "intraday_live_scanner.py" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "❌ File intraday_live_scanner.py not found in repo! Listing directory:"
            ls -la
            exit 1
          fi
          echo "🚀 Executing scanner script at: $SCRIPT_PATH"
          python "$SCRIPT_PATH"

      - name: Commit & Push Cumulative Live Breakouts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Fetch latest remote state to prevent concurrent conflicts
          git pull --rebase origin main
          
          if [ -f data/live_intraday_breakouts.json ]; then
            git add -f data/live_intraday_breakouts.json
            git commit -m "Auto-update Cumulative Breakouts (Zero-Delay NSE) [skip ci]" || echo "No changes to commit"
            git push origin main
          else
            echo "⚠️ No live_intraday_breakouts.json file generated to commit."
          fi
