name: Intraday Live Breakout Scanner v1

on:
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-live-scan]

concurrency:
  group: intraday-live-scanner
  cancel-in-progress: false

jobs:
  run-live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository (Fast Shallow)
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Locate and Execute Cumulative Intraday Live Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SCRIPT_PATH=$(find . -maxdepth 3 -iname "intraday_live_scanner.py" | head -n 1)
          if [ -z "$SCRIPT_PATH" ]; then
            echo "Error: intraday_live_scanner.py not found"
            exit 1
          fi
          echo "Executing scanner script at: $SCRIPT_PATH"
          python "$SCRIPT_PATH"

      - name: Commit & Push Cumulative Live Breakouts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes in breakout registers or logs to commit."
          else
            git commit -m "Auto-update live breakout scan registers [skip ci]"
            git push
          fi
