name: 30-Min Intraday Live Breakout Scanner

on:
  schedule:
    - cron: '45 3 * * 1-5'
    - cron: '15,45 4 * * 1-5'
    - cron: '15,45 5 * * 1-5'
    - cron: '15,45 6 * * 1-5'
    - cron: '15,45 7 * * 1-5'
    - cron: '15,45 8 * * 1-5'
    - cron: '15,45 9 * * 1-5'
  workflow_dispatch:

concurrency:
  group: live-intraday-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Run Standalone Intraday Live Scanner
        run: python intraday_live_scanner.py

      - name: Commit & Push Live Breakouts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/live_intraday_breakouts.json || true
          git commit -m "Auto-update Intraday Breakouts [skip ci]" || echo "No changes to commit"
          git push origin main
