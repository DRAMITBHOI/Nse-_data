name: 15-Min Intraday Live Breakout Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 3-10 * * 1-5'

concurrency:
  group: live-scan-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-live-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Cumulative Intraday Live Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python intraday_live_scanner.py

      - name: Commit & Push Cumulative Live Breakouts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_intraday_breakouts.json || true
          git commit -m "Auto-update Cumulative Breakouts [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main
