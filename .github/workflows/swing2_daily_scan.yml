name: Swing 2.0 Daily Production Scanner

on:
  schedule:
    # Runs Monday to Friday at 11:30 UTC (5:00 PM IST), after NSE delivery data settles
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Execute Swing 2.0 Scanner
        run: |
          python swing2_scanner.py

      - name: Commit and Push Scan Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/swing2_scanner_results.json
          
          # Only commit if results changed
          if git diff --staged --quiet; then
            echo "No changes detected in scan output."
          else
            git commit -m "Auto: Update Swing 2.0 scan results [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
