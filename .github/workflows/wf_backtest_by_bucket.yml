name: Execute Bucket-Wise 5-Year Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bucket-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas numpy requests

      - name: Ensure Data Directory Exists
        run: mkdir -p data

      - name: Run Bucket-Wise Backtest Engine
        run: python backtest_by_bucket.py

      - name: Commit & Push Bucket Backtest Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest_bucket_report.json
          if git diff --staged --quiet; then
            echo "No changes in bucket backtest report."
          else
            git commit -m "Update Bucket-Wise Backtest Report (2021-Present) [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
